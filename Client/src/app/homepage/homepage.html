<div class="homepage-container">
  <h1>Welcome to Wallet Tracker</h1>
  <p>Manage your cryptocurrency transactions</p>
  
  <div class="action-buttons">
    <button class="btn btn-primary" (click)="openQRScanner()">
      <span class="icon">📱</span>
      Scan QR Code
    </button>
    
    <!-- Add more buttons as needed -->
    <button class="btn btn-secondary" (click)="viewTransactions()">
      <span class="icon">📊</span>
      View Transactions
    </button>
    
    <button class="btn btn-success" (click)="addTransaction()">
      <span class="icon">➕</span>
      Add Transaction
    </button>
  </div>
</div>
