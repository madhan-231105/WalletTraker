<div class="login-container">
  <div class="login-card">
    <!-- App Branding -->
    <div class="login-header">
      <h1>Wallet Tracker</h1>
      <p>Securely access your financial dashboard</p>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="form-control"
          [ngClass]="{'error': email?.invalid && (email?.dirty || email?.touched)}"
          placeholder="Enter your email"
        >
        <div *ngIf="email?.invalid && (email?.dirty || email?.touched)" class="error-message">
          <span *ngIf="email?.errors?.['required']">Email is required.</span>
          <span *ngIf="email?.errors?.['email']">Please enter a valid email.</span>
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="form-control"
          [ngClass]="{'error': password?.invalid && (password?.dirty || password?.touched)}"
          placeholder="Enter your password"
        >
        <div *ngIf="password?.invalid && (password?.dirty || password?.touched)" class="error-message">
          <span *ngIf="password?.errors?.['required']">Password is required.</span>
          <span *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters.</span>
        </div>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="isLoading || loginForm.invalid"
        class="btn-primary"
      >
        <span *ngIf="isLoading" class="inline-block animate-spin mr-2">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 12a8 8 0 0116 0 8 8 0 01-16 0z" />
          </svg>
        </span>
        {{ isLoading ? 'Logging in...' : 'Log In' }}
      </button>
    </form>

    <!-- Social Login Buttons -->
    <div class="divider">
      <span>Or continue with</span>
    </div>

    <div class="social-buttons">
      <button
        (click)="loginWithGoogle()"
        [disabled]="isLoading"
        class="btn-social google"
      >
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12.24 10.667H7.614v2.667h4.626c-.426 2.133-2.346 3.666-4.626 3.666-2.653 0-4.8-2.147-4.8-4.8s2.147-4.8 4.8-4.8c1.24 0 2.373.48 3.226 1.267l1.893-1.893C11.573 5.253 9.893 4.667 8.014 4.667c-3.973 0-7.2 3.227-7.2 7.2s3.227 7.2 7.2 7.2c3.973 0 7.2-3.227 7.2-7.2v-1.2z" />
        </svg>
        Google
      </button>
      <button
        (click)="loginWithGithub()"
        [disabled]="isLoading"
        class="btn-social github"
      >
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.164 6.839 9.489.5.092.682-.217.682-.483 0-.237-.009-.868-.013-1.703-2.782.604-3.369-1.34-3.369-1.34-.454-1.153-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.647.349-1.087.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.026 2.747-1.026.546 1.377.203 2.394.099 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.688-4.566 4.936.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0022 12c0-5.523-4.477-10-10-10z" />
        </svg>
        GitHub
      </button>
    </div>

    <!-- Footer Links -->
    <div class="mt-6 text-center text-sm text-gray-600">
      <p>Don't have an account? <a [routerLink]="['/signup']" class="text-indigo-600 hover:underline">Sign up</a></p>
      <p class="mt-2"><a [routerLink]="['/forgot-password']" class="text-indigo-600 hover:underline">Forgot password?</a></p>
    </div>
  </div>
</div>
